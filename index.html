<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Blady</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #07111f, #0b1f38);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(180deg, #0ea5e9, #38bdf8);
      border-radius: 25px;
      overflow: visible;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .hero {
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #000;
    }

    .sub {
      font-size: 16px;
      margin-bottom: 10px;
      color: #111827;
    }

    .content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-decoration: none;
      color: black;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.10);
      text-align: center;
      display: block;
    }

    .card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .btn-whatsapp {
      background: #0f172a;
      color: white;
    }

    .btn-whatsapp p,
    .btn-whatsapp .info {
      color: rgba(255, 255, 255, 0.82);
    }

    .btn-email {
      background: #1e293b;
      color: white;
    }

    .btn-email p,
    .btn-email .info {
      color: rgba(255, 255, 255, 0.82);
    }

    .info {
      font-size: 13px;
      margin-top: 8px;
      opacity: 0.9;
    }

    form.card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    form.card strong,
    form.card p {
      text-align: center;
    }

    form.card input,
    form.card select,
    form.card textarea,
    form.card button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      font-size: 14px;
      outline: none;
    }

    form.card input:focus,
    form.card select:focus,
    form.card textarea:focus {
      border-color: #0ea5e9;
    }

    form.card textarea {
      resize: vertical;
      min-height: 110px;
    }

    form.card button {
      background: #0f172a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    form.card button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      color: white;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .page {
        max-width: 100%;
        border-radius: 20px;
      }

      .hero {
        padding: 24px 16px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }

      h1 {
        font-size: 24px;
      }

      .sub {
        font-size: 15px;
      }

      .content {
        padding: 15px;
        gap: 12px;
      }

      .card {
        padding: 16px;
        border-radius: 16px;
      }

      form.card input,
      form.card select,
      form.card textarea,
      form.card button {
        font-size: 16px;
      }

      .footer {
        font-size: 13px;
        padding: 18px 14px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="hero">
      <img src="logo.jpg" class="logo" alt="Logo Space Blady">
      <h1>Space Blady</h1>
      <p class="sub">Criação de sites profissionais</p>
    </div>

    <div class="content">

      <a href="https://wa.me/5562981479674" target="_blank" class="card btn-whatsapp">
        <strong>WhatsApp</strong>
        <p>Atendimento rápido e direto</p>
        <div class="info">(62) 98147-9674</div>
      </a>

      <a href="mailto:spaceblady@gmail.com?subject=Orçamento%20de%20Site&body=Olá,%20vim%20pelo%20site." class="card btn-email">
        <strong>E-mail</strong>
        <p>Toque para enviar uma mensagem</p>
        <div class="info">spaceblady@gmail.com</div>
      </a>

      <form action="https://formspree.io/f/mgongyed" method="POST" class="card">
        <strong>Solicitar orçamento</strong>
        <p>Preencha os dados do seu projeto</p>

        <input type="text" name="nome" placeholder="Seu nome" required>
        <input type="text" name="whatsapp" placeholder="Seu WhatsApp" required>
        <input type="email" name="email" placeholder="Seu e-mail" required>

        <select name="tipo_site" required>
          <option value="">Escolha o tipo de site</option>
          <option value="site-profissional">Site profissional</option>
          <option value="landing-page">Landing page</option>
          <option value="loja-virtual">Loja virtual</option>
          <option value="portfolio">Portfólio</option>
        </select>

        <textarea name="descricao" placeholder="Descreva como você quer seu site" required></textarea>

        <button type="submit">Enviar formulário</button>
      </form>

    </div>

    <div class="footer">
      © 2026 Space Blady<br>
      Todos os direitos reservados
    </div>

  </div>
</body>
</html>
