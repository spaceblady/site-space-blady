<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Blady</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #07111f, #0b1f38);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(180deg, #0ea5e9, #38bdf8);
      border-radius: 25px;
      overflow: hidden;
    }

    .hero {
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-decoration: none;
      color: black;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .btn-whatsapp {
      background: #0f172a;
      color: white;
    }

    .btn-email {
      background: #1e293b;
      color: white;
    }

    .info {
      font-size: 13px;
      margin-top: 8px;
      opacity: 0.85;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      color: white;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- TOPO -->
    <div class="hero">
      <img src="logo.jpg" class="logo">
      <h1>Space Blady</h1>
      <p class="sub">Criação de sites profissionais</p>
    </div>

    <!-- CONTEÚDO -->
    <div class="content">

      <!-- WHATSAPP -->
      <a href="https://wa.me/5562981479674" target="_blank" class="card btn-whatsapp">
        <strong>WhatsApp</strong>
        <p>Atendimento rápido e direto</p>
        <div class="info">(62) 98147-9674</div>
      </a>

      <!-- EMAIL -->
      <a href="mailto:spaceblady@gmail.com?subject=Orçamento%20de%20Site&body=Olá,%20vim%20pelo%20site." class="card btn-email">
        <strong>E-mail</strong>
        <p>Toque para enviar uma mensagem</p>
        <div class="info">spaceblady@gmail.com</div>
      </a>

      <!-- SERVIÇOS -->
      <div class="card">
        <strong>Serviços</strong>
        <p>Sites profissionais, landing pages e estrutura digital para negócios.</p>
      </div>

    </div>

    <!-- RODAPÉ -->
    <div class="footer">
      © 2026 Space Blady<br>
      Todos os direitos reservados
    </div>

  </div>
</body>
</html>
